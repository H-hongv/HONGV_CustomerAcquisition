version: "3.9"

services:
  sdr-agent:
    build: .
    container_name: sdr-agent
    restart: unless-stopped
    volumes:
      - ./memory:/app/memory
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./industries:/app/industries:ro
    environment:
      - TZ=Asia/Shanghai
    command: ["daemon.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import health,sys; sys.exit(0 if health.quick_health_check() else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
